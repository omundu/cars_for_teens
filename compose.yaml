services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cars_for_teens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensesame}
      POSTGRES_DB: ${POSTGRES_DB:-development_cars_for_teens}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cars_for_teens} -d ${POSTGRES_DB:-development_cars_for_teens}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
